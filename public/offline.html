<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Chinese Flashcards</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #ededed;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card { text-align: center; padding: 2rem; }
    .glyph { font-size: 5rem; font-weight: bold; margin-bottom: 1rem; }
    .title { font-size: 1.25rem; color: #a1a1aa; }
    .subtitle { margin-top: 0.5rem; font-size: 0.9rem; color: #71717a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="glyph">中</div>
    <p class="title">You're offline</p>
    <p class="subtitle">Open the app again when you have a connection.</p>
  </div>
</body>
</html>
